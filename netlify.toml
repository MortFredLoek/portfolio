# Netlify settings. Plain static site: no build step, publish the site/ folder.
[build]
  publish = "site"
  command = ""

# Fonts and images rarely change, so let browsers cache them.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Old GitHub Pages address for the work page.
[[redirects]]
  from = "/work.html"
  to = "/work/"
  status = 301
