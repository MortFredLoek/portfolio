<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morten Fredslund Løkke — Ambient Designer &amp; Tech Researcher</title>
<meta name="description" content="Morten Fredslund Løkke is an ambient designer and tech researcher based in Copenhagen, Denmark.">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <h1 class="sr-only">Morten Fredslund Løkke</h1>
  <nav class="menu">
    <a href="work.html">Work</a>
    <button type="button" aria-expanded="false" aria-controls="contact">Contact</button>
  </nav>
  <section class="contact" id="contact" hidden>
    <p>
      Morten Fredslund Løkke is an ambient designer and tech researcher based in Copenhagen, Denmark.<br>
      <a href="mailto:mfloekke@live.dk">mfloekke@live.dk</a>
    </p>
  </section>
  <script>
    const toggle = document.querySelector('.menu button');
    const contact = document.getElementById('contact');
    toggle.addEventListener('click', () => {
      const open = contact.hidden;
      contact.hidden = !open;
      toggle.setAttribute('aria-expanded', String(open));
    });
  </script>
</body>
</html>
